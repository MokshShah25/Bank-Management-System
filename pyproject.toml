[project]
name = "bank-management-system"
version = "0.1.0"
description = "A Bank Management System built with Python and Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0"
]

[project.scripts]
bank-management-system = "main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"